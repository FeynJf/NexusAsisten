plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Nomor build mengikuti nomor run GitHub Actions (dipakai fitur Update di aplikasi).
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()

// Keystore tetap (disimpan sebagai teks base64) supaya APK dari tiap build punya tanda tangan sama,
// sehingga aplikasi bisa memperbarui dirinya sendiri tanpa harus uninstall.
def keystoreB64 = file("nexus-debug.keystore.b64")
def keystoreOut = file("$projectDir/.signing/nexus-debug.keystore")
def hasKeystore = keystoreB64.exists()
if (hasKeystore) {
    keystoreOut.parentFile.mkdirs()
    keystoreOut.bytes = keystoreB64.text.replaceAll("\\s", "").decodeBase64()
}

android {
    namespace 'com.nexus.asisten'
    compileSdk 33

    defaultConfig {
        applicationId "com.nexus.asisten"
        minSdk 29
        targetSdk 33
        versionCode 100 + runNumber
        versionName "1.8"
        buildConfigField "int", "BUILD_NUMBER", "${runNumber}"
        buildConfigField "String", "UPDATE_REPO", "\"FeynJf/NexusAsisten\""
    }

    signingConfigs {
        nexus {
            if (hasKeystore) {
                storeFile keystoreOut
                storePassword "nexus123"
                keyAlias "nexus"
                keyPassword "nexus123"
            }
        }
    }

    buildTypes {
        debug {
            if (hasKeystore) signingConfig signingConfigs.nexus
        }
        release {
            // APK rilis non-debuggable, ditandatangani dengan keystore tetap yang sama (lebih dipercaya Play Protect).
            if (hasKeystore) signingConfig signingConfigs.nexus
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
}
